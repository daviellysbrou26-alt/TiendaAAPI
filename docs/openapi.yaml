openapi: 3.0.3
info:
  title: TiendaAPI
  version: 1.0.0
  description: API de la tienda en línea del curso INF 323
servers:
  - url: http://localhost:3000
tags:
  - name: Productos
  - name: Pedidos

paths:
  /api/v1/productos:
    get:
      tags: [Productos]
      summary: Listar productos
      parameters:
        - name: categoria
          in: query
          required: false
          schema: { type: string, example: Calzado }
      responses:
        '200':
          description: Lista de productos

  /api/v1/productos/{id}:
    get:
      tags: [Productos]
      summary: Obtener un producto por id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 3 }
      responses:
        '200':
          description: Producto encontrado
        '400':
          description: Id inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Producto no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/pedidos:
    post:
      tags: [Pedidos]
      summary: Crear un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPedido' }
      responses:
        '201':
          description: Pedido registrado; el stock se descontó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Producto inexistente o stock insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: STOCK_INSUFICIENTE, mensaje: Solo quedan 2 de Reloj digital }

    get:
      tags: [Pedidos]
      summary: Listar pedidos
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [pendiente, pagado, enviado, cancelado]
            example: pendiente
      responses:
        '200':
          description: Lista de pedidos (más reciente primero)
        '400':
          description: Estado inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Ver un pedido con sus productos
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Pedido con sus items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoConItems' }
        '400':
          description: Id inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    patch:
      tags: [Pedidos]
      summary: Cambiar el estado de un pedido
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioEstado' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  estado: { type: string }
        '400':
          description: Estado inválido o datos incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: No se puede cancelar un pedido ya enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    NuevoPedido:
      type: object
      required: [cliente, items]
      properties:
        cliente:
          type: object
          required: [nombre, correo]
          properties:
            nombre: { type: string, example: Ana Pérez }
            correo: { type: string, format: email, example: ana@correo.com }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [producto_id, cantidad]
            properties:
              producto_id: { type: integer, example: 1 }
              cantidad: { type: integer, minimum: 1, example: 2 }

    Pedido:
      type: object
      properties:
        id: { type: integer }
        cliente_nombre: { type: string }
        cliente_correo: { type: string }
        estado: { type: string, enum: [pendiente, pagado, enviado, cancelado] }
        total: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              producto_id: { type: integer }
              nombre: { type: string }
              cantidad: { type: integer }
              precio_unitario: { type: number }

    PedidoConItems:
      allOf:
        - $ref: '#/components/schemas/Pedido'
        - type: object
          properties:
            creado_en: { type: string, format: date-time }

    CambioEstado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pendiente, pagado, enviado, cancelado]
          example: pagado

    Error:
      type: object
      properties:
        error: { type: string }
        mensaje: { type: string }
