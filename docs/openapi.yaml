
openapi: 3.0.3
info:
  title: TiendaAPI - Pedidos
  version: 1.0.0
  description: API para gestionar productos y pedidos de una tienda.

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local

tags:
  - name: Productos
    description: Consulta de productos
  - name: Pedidos
    description: Creación y gestión de pedidos

paths:
  /productos:
    get:
      tags:
        - Productos
      summary: Listar productos
      responses:
        '200':
          description: Lista de productos

  /pedidos:
    get:
      tags:
        - Pedidos
      summary: Listar pedidos
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - pendiente
              - pagado
              - enviado
              - cancelado
      responses:
        '200':
          description: Lista de pedidos
        '400':
          description: Estado inválido

    post:
      tags:
        - Pedidos
      summary: Crear un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente
                - items
              properties:
                cliente:
                  type: object
                  required:
                    - nombre
                    - correo
                  properties:
                    nombre:
                      type: string
                      example: Ana Pérez
                    correo:
                      type: string
                      format: email
                      example: ana@correo.com
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - producto_id
                      - cantidad
                    properties:
                      producto_id:
                        type: integer
                        example: 1
                      cantidad:
                        type: integer
                        minimum: 1
                        example: 2
      responses:
        '201':
          description: Pedido creado
        '400':
          description: Datos inválidos
        '422':
          description: Producto inexistente o stock insuficiente

  /pedidos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador del pedido

    get:
      tags:
        - Pedidos
      summary: Consultar un pedido con sus productos
      responses:
        '200':
          description: Detalle del pedido
        '400':
          description: ID inválido
        '404':
          description: Pedido no encontrado

    patch:
      tags:
        - Pedidos
      summary: Cambiar el estado de un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estado
              properties:
                estado:
                  type: string
                  enum:
                    - pendiente
                    - pagado
                    - enviado
                    - cancelado
                  example: pagado
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: ID o estado inválido
        '404':
          description: Pedido no encontrado
